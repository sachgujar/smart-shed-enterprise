@if(isAuthPage()){
<router-outlet />
} @else {
<mat-sidenav-container class="app-shell">
  <mat-sidenav #sidenav class="app-sidenav" [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset() && sidenavOpen()">

    <div class="brand">
      <span class="logo">SSE</span>
      <span class="brand-text">Smart Shed Enterprose</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" 
      (click)="isHandset() && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/animals" routerLinkActive="active" (click)="isHandset() && sidenav.close()">
          <mat-icon matListItemIcon>pets</mat-icon>
          <span matListItemTitle>Animals</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <small>v0.1.0 - SSE Version</small>
    </div>

  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="top-bar">
      @if(isHandset()){
        <button mat-icon-button (click)="sidenav.toggle()" area-label="Menu">
          <mat-icon>menu</mat-icon>
        </button>
      } @else {
        <button mat-icon-button (click)="toggleSidenav()" area-label="Toggle sidenav">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="title">Smart Shed Enterprise</span>
      <span class="spacer"></span>

      @if(auth.user(); as u){
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
          <span class="user-name">{{u.displayName}}</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="menu-header">
            <strong>{{ u.displayName }}</strong>
            <small>{{ u.role }}</small>
          </div>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>


</mat-sidenav-container>
}
